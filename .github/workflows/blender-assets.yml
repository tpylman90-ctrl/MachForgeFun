name: Build Blender Range Assets

on:
  push:
    branches: [main]
    paths:
      - "tools/blender/**"
      - ".github/workflows/blender-assets.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate-range-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Blender 4.5.14 LTS
        shell: bash
        run: |
          set -euo pipefail
          release="https://download.blender.org/release/Blender4.5"
          archive="blender-4.5.14-linux-x64.tar.xz"
          install_dir="$RUNNER_TEMP/blender-4.5.14"
          mkdir -p "$install_dir"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$RUNNER_TEMP/$archive" "$release/$archive"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$RUNNER_TEMP/blender-4.5.14.sha256" "$release/blender-4.5.14.sha256"
          (cd "$RUNNER_TEMP" && grep -F "$archive" blender-4.5.14.sha256 | sha256sum --check --strict)
          tar -xJf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/blender" --background --factory-startup --python-expr \
            "import bpy; print('Blender', bpy.app.version_string); assert bpy.app.version >= (4, 5, 0)"

      - name: Generate range scene and GLB
        run: blender --background --python tools/blender/generate_range_scene.py

      - name: Validate exported scene
        run: python3 tools/blender/validate_glb.py artifacts/machforge_range.glb

      - name: Stage generated assets in the game
        run: |
          mkdir -p assets/blender_source
          cp artifacts/machforge_range.blend assets/blender_source/
          cp artifacts/machforge_range.glb artifacts/machforge_range_preview.png assets/
          test -s assets/machforge_range_preview.png

      - name: Commit generated game assets
        id: commit_assets
        run: |
          echo "assets_changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/blender_source/machforge_range.blend assets/machforge_range.glb assets/machforge_range_preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Add generated cannon and range assets"
            git pull --rebase --strategy-option=theirs origin main
            git push
            echo "assets_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Android build for regenerated assets
        if: steps.commit_assets.outputs.assets_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-apk.yml --ref main

      - name: Save Blender assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: machforge-range-assets
          path: |
            artifacts/machforge_range.blend
            artifacts/machforge_range.glb
            artifacts/machforge_range_preview.png
          if-no-files-found: error
          retention-days: 30

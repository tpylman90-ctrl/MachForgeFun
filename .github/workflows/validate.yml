name: Validate MachForgeFun

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Blender 4.5.14 LTS
        shell: bash
        run: |
          set -euo pipefail
          release="https://download.blender.org/release/Blender4.5"
          archive="blender-4.5.14-linux-x64.tar.xz"
          install_dir="$RUNNER_TEMP/blender-4.5.14"
          mkdir -p "$install_dir"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$RUNNER_TEMP/$archive" "$release/$archive"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$RUNNER_TEMP/blender-4.5.14.sha256" "$release/blender-4.5.14.sha256"
          (cd "$RUNNER_TEMP" && grep -F "$archive" blender-4.5.14.sha256 | sha256sum --check --strict)
          tar -xJf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/blender" --background --factory-startup --python-expr \
            "import bpy; print('Blender', bpy.app.version_string); assert bpy.app.version >= (4, 5, 0)"

      - name: Validate browser app structure and JavaScript
        run: python3 tools/validate_web_app.py

      - name: Build Blender range scene
        run: blender --background --python tools/blender/generate_range_scene.py

      - name: Validate and stage generated scene preview
        run: |
          python3 tools/blender/validate_glb.py artifacts/machforge_range.glb
          test -s artifacts/machforge_range.blend
          test -s artifacts/machforge_range_preview.png
          mkdir -p assets
          cp artifacts/machforge_range_preview.png assets/machforge_range_preview.png

      - name: Install pinned Playwright browser test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx --no-install playwright install --with-deps chromium

      - name: Start local app server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/machforgefun-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/machforgefun-http.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/machforgefun-http.log"
          exit 1

      - name: Smoke test desktop and mobile browser flows
        run: node tools/smoke_test.mjs

      - name: Upload browser captures and generated assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machforgefun-validation-captures
          path: |
            artifacts/machforgefun-smoke-desktop.png
            artifacts/machforgefun-smoke-mobile.png
            artifacts/machforge_range.blend
            artifacts/machforge_range.glb
            artifacts/machforge_range_preview.png
          if-no-files-found: warn
          retention-days: 30

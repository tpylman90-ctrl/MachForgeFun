name: Validate Godot Range

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "tools/blender/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Install Blender 4.5.14 LTS
        shell: bash
        run: |
          set -euo pipefail
          release="https://download.blender.org/release/Blender4.5"
          archive="blender-4.5.14-linux-x64.tar.xz"
          install_dir="$RUNNER_TEMP/blender-4.5.14"
          mkdir -p "$install_dir"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$RUNNER_TEMP/$archive" "$release/$archive"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$RUNNER_TEMP/blender-4.5.14.sha256" "$release/blender-4.5.14.sha256"
          (cd "$RUNNER_TEMP" && grep -F "$archive" blender-4.5.14.sha256 | sha256sum --check --strict)
          tar -xJf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Validate the Blender scene and Godot GLB asset
        run: |
          python3 tools/blender/validate_glb.py assets/machforge_range.glb
          blender --background --python tools/blender/generate_range_scene.py
          python3 tools/blender/validate_glb.py artifacts/machforge_range.glb
          test -s artifacts/machforge_range.blend
          test -s artifacts/machforge_range_preview.png

      - name: Import Godot project resources
        run: godot --headless --editor --path . --import --quit

      - name: Smoke test the range scene
        run: godot --headless --path . --quit-after 8

      - name: Upload generated Blender review assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MachForgeFun-Blender-Range-Review
          path: |
            artifacts/machforge_range.blend
            artifacts/machforge_range.glb
            artifacts/machforge_range_preview.png
          if-no-files-found: warn
          retention-days: 30
